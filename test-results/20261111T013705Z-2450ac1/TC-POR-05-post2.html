<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nodo clima</title><style>body{font-family:system-ui,sans-serif;margin:0;padding:16px;max-width:28rem;margin-inline:auto;background:#f6f7f9;color:#1d2330}h1{font-size:1.4rem;margin:0}.sub{color:#5b6475;margin:.2rem 0 1rem;font-size:.9rem}fieldset{border:1px solid #d5d9e0;border-radius:10px;background:#fff;margin:0 0 1rem;padding:.6rem 1rem 1rem}.ayuda{display:block;color:#6b7280;font-size:.8rem;margin-top:.25rem}.error{display:block;color:#b42318;font-size:.85rem;margin-top:.25rem}input[aria-invalid]{border-color:#b42318}.aviso{background:#fef3f2;border:1px solid #fda29b;color:#912018;border-radius:10px;padding:.7rem 1rem;margin:0 0 1rem}legend{font-weight:600;padding:0 .3rem}label{display:block;margin:.7rem 0 .25rem;font-size:.95rem}input{box-sizing:border-box;width:100%;font-size:1rem;padding:.6rem;border:1px solid #b9c0cc;border-radius:8px}.ojo{display:flex;gap:.4rem}.ojo button{flex:none;width:3rem;font-size:1.2rem;border:1px solid #b9c0cc;border-radius:8px;background:#fff}button[type=submit]{width:100%;font-size:1.05rem;padding:.8rem;border:0;border-radius:10px;background:#1f6feb;color:#fff}</style></head><body><h1>Nodo clima</h1><p class="sub">clima-f3c6d4 &middot; firmware 0.0.0-2450ac1-bench</p><p class="aviso" id="errores" role="alert">Revisa los campos marcados. No se guardó nada.</p><form method="post" action="/"><fieldset><legend>Wi-Fi de la casa</legend><label for="wifi_ssid">Red</label><input id="wifi_ssid" name="wifi_ssid" type="text" maxlength="32" required autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="nombre de tu Wi-Fi" value="red-de-prueba"><label for="wifi_pass">Contraseña</label><div class="ojo"><input id="wifi_pass" name="wifi_pass" type="password" maxlength="63" autocomplete="off" aria-invalid="true" aria-describedby="err-wifi_pass"><button type="button" aria-label="Mostrar u ocultar la contraseña" title="Mostrar u ocultar la contraseña" onclick="o('wifi_pass')">&#128065;</button></div><small class="error" id="err-wifi_pass">Déjala vacía si la red es abierta, o usa de 8 a 63 caracteres sin acentos ni ñ.</small></fieldset><fieldset><legend>Servidor MQTT</legend><label for="mqtt_host">Servidor</label><input id="mqtt_host" name="mqtt_host" type="text" maxlength="63" required autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="homeassistant.local" value="broker.local"><label for="mqtt_port">Puerto</label><input id="mqtt_port" name="mqtt_port" type="number" min="1" max="65535" required value="1883"><label for="mqtt_user">Usuario (opcional)</label><input id="mqtt_user" name="mqtt_user" type="text" maxlength="64" autocapitalize="none" autocorrect="off" spellcheck="false" value=""><label for="mqtt_pass">Contraseña (opcional)</label><div class="ojo"><input id="mqtt_pass" name="mqtt_pass" type="password" maxlength="64" autocomplete="off"><button type="button" aria-label="Mostrar u ocultar la contraseña" title="Mostrar u ocultar la contraseña" onclick="o('mqtt_pass')">&#128065;</button></div></fieldset><fieldset><legend>Ubicación</legend><label for="sitio">Sitio</label><input id="sitio" name="sitio" type="text" maxlength="32" required autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="sitio1" value="sitio1"><small class="ayuda">minúsculas, números, - y _</small><label for="zona">Zona</label><input id="zona" name="zona" type="text" maxlength="32" required autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="zona1" value="zona1"><small class="ayuda">minúsculas, números, - y _</small></fieldset><button type="submit">Guardar y conectar</button></form><script>function o(i){var e=document.getElementById(i);e.type=e.type==='password'?'text':'password'}</script></body></html>
