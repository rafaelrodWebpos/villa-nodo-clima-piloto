# El journey en el job verify (build.yml) corre sobre la imagen de PRODUCCIÓN
# del tag (opción a, propietario, 2026-11-02). Pasos que usan algo que solo
# tiene la imagen de banco, y cómo se tratan allí. Revisar antes del primer tag.
release_verify:
  first_tag: v0.0.1   # decisión del propietario (H-37, 2026-11-03): el primer tag de release; el tag lo crea él cuando /build anuncie Ready for shipment
  image: producción del tag (--firmware-dir fw)
  steps_with_bench_only_features:
    - step: JRN-01.0
      feature: marcador NODO-BENCH-IMAGE (C-LOG-01)
      in_verify: se exige su ausencia en el arranque (implementado en el test)
    - step: JRN-01.3
      feature: log UDP (FR-LOG-02, E11), solo con CONFIG_NODO_UDP_LOG=y
      in_verify: >
        la parte UDP pasa a su contraparte de producción: el receptor UDP del
        banco no recibe nada del DUT durante los 3 ciclos. FR-LOG-01 completo
        sigue sin verificar hasta bench-traffic-capture (CR-TB-04). Se
        implementa al escribir JRN-01.3
  not_in_journey:
    - feature: comandos serie E13 (wdt-test, reiniciar; C-LOG-02)
      used_by: [NFR-WDT-01, FR-TIME-02]
      note: ningún paso del journey los usa; se verifican fuera de verify, con la imagen de banco
  ota_note: >
    JRN-02.* parten de la imagen de producción grabada y hacen OTA a las
    pre-releases ota-test-*; ninguna depende de funciones de banco

