# Plan de pruebas — Nodo Clima Piloto
#
# Propiedad de /build. Cada test declara lo que verifica (verifies: IDs del
# FSD), lo que necesita (needs: capacidades) y dónde está su ejecutable (impl:).
# El bloqueo se CALCULA a partir de needs × capabilities; nunca se escribe.
# Los resultados (status, commit, date) los escribe quien ejecuta el test.

project: villa-nodo-clima-piloto
fsd: docs/Functionality/FSD-nodo-clima.md
fsd_version: 0.9.6
testing_standard: docs/Method/standards/testing.md
debugging_agenda: testing/debugging-agenda.md
gates_dir: testing/gates/

dut:
  board: Waveshare ESP32-S3-DEV-KIT-N8R8, módulo ESP32-S3-WROOM-1 N8R8 (FSD C-HW-01)
  usb: un USB-C con hub — USB-Serial/JTAG 303a:1001 + CH343 1a86:55d3 (consola primaria UART0, C-HW-08)
  target: esp32s3
  flash: 8MB (C-HW-02)
  slot: SLOT1
  identity:   # observado por /commission el 2026-11-01 (agenda, fila 1)
    recorded_in: ae08e7b   # firmware observado: 05735b7 (commissioning.forward_path)
    chip: ESP32-S3 (QFN56), revisión v0.2
    features: Wi-Fi, BT 5 (LE), Dual Core + LP Core, 240MHz, Embedded PSRAM 8MB (AP_3v3)
    flash: 8MB detectados (fabricante c8, dispositivo 4017; quad por eFuse, 3,3 V)
    mac: 3c:0f:02:f3:c6:d4
    read_by: >
      esptool flash_id por RFC2217 desde la imagen del devcontainer
      (nodo-clima-piloto-dev, IDF v6.0.2), contrastado con POST /api/chip/info
      del banco: misma MAC, chip, revisión, PSRAM y flash
    matches: C-HW-01, C-HW-02
    publication: >
      la MAC queda publicada (H-20): la verificación de identidad del DUT la
      necesita completa y ya está en el historial. Decisión del propietario
      (2026-11-02): esta placa es unidad permanente del banco y nunca se
      instalará en una propiedad real; las unidades que se instalen no
      aparecerán en el repositorio público (NFR-SEC-01)
  test_partner_slot: SLOT2   # segunda Waveshare N8R8; presente e idle el 2026-10-31, ausente (state absent) el 2026-11-01; ningún test del plan la necesita todavía
  boot_marker: "Init complete"      # última línea de app_main (contrato del testbench)
  bench_image_marker: NODO-BENCH-IMAGE   # solo en la imagen de banco (C-LOG-01)

testbench:
  status: montado
  hostname: testbench-b99c
  address: no se versiona — el repo es público; se descubre en cada sesión o
    se lee de un fichero ignorado por git (.env)
  last_seen: 2026-11-02   # TestbenchDriver.info()/get_devices(): SLOT1 idle, SLOT2 absent (desconectada a propósito). Antes, 2026-11-01 /api/info: hostname testbench-b99c, 4 slots configurados; 2 en marcha por la mañana, 1 por la tarde (SLOT2 absent); no reporta versión del portal
  reported: 2026-11-02   # releídas en vivo por /build el 2026-11-02, los 7 endpoints ok (antes: 2026-11-01, /commission y checkers de la puerta 03); lecturas GET de /api/info, /api/devices, /api/wifi/*,
                         # /api/mqtt/status, /api/udplog, /api/human/status
  note: >
    Las capacidades del banco se copian de lo que el banco reporta y se
    declaran yes sin prueba propia. Lo que el banco no reporta queda en no con
    su motivo; si un test lo necesita, es una petición de cambio al testbench.

tiers: [host, target, bench, bench+, field, other, manual]   # FSD §22.0

# ---------------------------------------------------------------------------
# Capacidades. Banco: copiadas de lo que reporta; un proyecto no las prueba.
# Proyecto: unproven hasta verlas funcionar aquí; cada unproven que necesita un
# test de banco es un punto de la agenda (field-site se prueba al instalar).
# ---------------------------------------------------------------------------
capabilities:
  # --- banco: copiadas de lo que reporta (2026-10-31; releídas el 2026-11-01); un proyecto no las prueba ---
  bench-flash:
    what: flashear el DUT a través del testbench (/api/flash, offsets de flash_args)
    available: yes
    reported_by: /api/devices — SLOT1 presente, running, RFC2217 en el puerto 4001
  bench-chip-info:
    what: leer chip, revisión, MAC y tamaño de flash del DUT (POST /api/chip/info, esptool flash_id en el Pi; reinicia el DUT)
    available: yes
    reported_by: /api/devices — SLOT1 presente e idle, sin sesión de depuración (debugging false)
    exercised: 2026-11-01 — POST /api/chip/info sobre SLOT1 devolvió ok con chip, MAC y flash (dut.identity)
  bench-serial-monitor:
    what: >
      leer la consola del DUT por el devnode que el banco proxifica en el slot
      (SLOT1: ttyACM0), con DTR/RTS en bajo. Con C-HW-08 el log sale por los
      dos devnodes, así que cualquiera de los dos sirve para observarlo
    available: yes
    reported_by: /api/devices — SLOT1 devnode ttyACM0, monitor_port 5001 (devnodes ttyACM0 y ttyACM1)
    known_limitation: >
      H-60 (2026-11-07): por /dev/ttyACM0 (consola USB-Serial/JTAG del DUT, en el modo
      sin driver de ESP-IDF 6.0.2, que no envía el paquete de cierre) una línea de
      exactamente 64 bytes con su \r\n puede llegar tarde, hasta la siguiente salida:
      medido 47,75 s para «I (372788) nodo: con: CONECTANDO_BROKER -> OPERATIVO
      (mqtt_up)», con todas las demás líneas a 0,00–0,01 s y la misma línea por UDP a
      su hora. No afecta a la instalación real (solo cargador, sin PC). Los tests lo
      toleran: las esperas de líneas por consola llegan a 150 s (un ciclo de med:) y
      los contratos con plazo se miden por MQTT o por UDP. Arreglo en el DUT aparcado
      por el propietario (H-59, H-60)
  bench-dual-console:
    what: observar a la vez los dos devnodes del slot (UART0/CH343 y USB-Serial/JTAG) por separado (C-HW-08)
    available: no
    reason: >
      el banco proxifica un solo devnode por slot (un RFC2217 y un monitor_port)
      y no dice a qué interfaz USB corresponde; la parte «en ambos» del contrato
      de C-HW-08 queda bloqueada en el banco (petición de cambio al testbench)
  bench-udp-log-receiver:
    what: receptor UDP 5555 del testbench con buffer de líneas
    available: yes
    reported_by: /api/udplog responde ok
  bench-wifi-ap:
    what: SoftAP del testbench al que se une el DUT
    available: yes
    reported_by: /api/wifi/ap_status responde ok (inactivo)
    exercised: >
      2026-11-01, tras desbloquear el propietario la radio del Pi (rfkill,
      CR-TB-06): POST /api/wifi/ap_start con un SSID desechable, canal 6 y sin
      internet → ok, ip 192.168.4.1; ap_status active, canal 6. Un primer
      intento, con la radio bloqueada, había fallado con «rfkill: WLAN soft
      blocked»
    consequence: >
      canal 1–11: el hostapd del banco fija country_code=CH y en RD solo se
      permiten los canales 1–11 (CR-TB-07). Los tests y el portal usan un
      canal de ese rango
  bench-wifi-ap-outage:
    what: apagar y encender el AP del banco bajo demanda
    available: yes
    reported_by: /api/wifi/ap_status responde ok
    exercised: >
      2026-11-01 — ap_stop → inactivo; ap_start → activo otra vez en el canal 6;
      ap_stop final → inactivo. El estado del banco quedó igual que antes (modo
      wifi-testing, AP inactivo, broker parado, mismos slots y host_ip).
      Rutas del Pi tras el ejercicio, comprobadas por el propietario en el Pi
      (el banco no las expone por la API): `ip route` muestra solo la ruta por
      defecto por eth0 (metric 100) y la red local por eth0, ninguna por
      wlan0; rfkill sigue con Wireless LAN «Soft blocked: no»
  bench-portal-driver:
    what: el banco se une al AP del DUT y maneja el portal (GET/POST, escaneo de SSID)
    available: yes
    reported_by: /api/wifi/events responde ok
    exercise: >
      se vuelve a declarar por decisión del propietario (2026-11-01): se ejerce
      en JRN-01.1, porque hasta que exista el portal del DUT no hay AP al que
      unirse. La radio que comparte con bench-wifi-ap ya está desbloqueada.
    exercised: >
      2026-11-02, JRN-01.1 sobre a0191b6 (escaneo) y TC-POR-02 sobre 20dbae8
      (sta_join al AP abierto del DUT y relé HTTP). Tras sta_join la API del
      banco sigue respondiendo: la ruta por defecto de eth0 no se desplaza
  bench-mqtt-broker:
    what: broker mosquitto del banco en la red de su AP, puerto 1883
    available: yes
    reported_by: /api/mqtt/status responde ok (parado)
  bench-broker-outage:
    what: parar y arrancar el broker del banco bajo demanda
    available: yes
    reported_by: /api/mqtt/status responde ok
    exercised: >
      2026-11-01 — POST /api/mqtt/start → ok, puerto 1883, status running;
      POST /api/mqtt/stop → ok, status parado (igual que antes)
  bench-mqtt-auth:
    what: broker MQTT del banco con autenticación por usuario y contraseña (FR-MQTT-07)
    available: no
    reason: /api/mqtt/status no reporta autenticación — petición CR-TB-03 (testing/testbench-change-requests.md)
  bench-operator-prompt:
    what: avisos bloqueantes al operador en la UI del banco (acciones físicas)
    available: yes
    reported_by: /api/human/status responde ok
  bench-ap-internet:
    what: el AP del banco da salida a Internet (github.com, release-assets.githubusercontent.com, pool.ntp.org) — nivel bench+
    available: yes
    reported_by: >
      GET /api/info → capabilities incluye bench-ap-internet (build 8966260);
      GET /api/wifi/internet → internet, lan_blocked, rules_ok, rules. Banco con el fork
      propio rafaelrodWebpos/Embedded-AI-Harness, tag villa-1 (H-72, H-73, H-74)
    observed: >
      2026-11-08, regresión del fork (testing/regresion-fork-villa-1.md). FORK-01
      (test-results/20261108T141629Z-660f6f5/): apagada por defecto y tras ap_stop, los 9
      rangos privados cortados antes del ACCEPT, cuerpos no booleanos → 400, rules_ok en
      los 12 pasos. FORK-02 (mismo directorio): el DUT sincroniza SNTP a 13,4 s de encender
      la salida, hora_valida = true y ts real. FORK-03 (test-results/20261108T151202Z-3b37ba6/):
      con la salida encendida el DUT no llega en 180 s a un broker de la LAN y sí sale a
      Internet; control positivo en el log del broker. Vuelta atrás con un comando y
      reinstalación comprobadas por HTTP
    consequence: >
      desbloquea JRN-01.6, los contratos de hora en bench+ (FR-TIME-01…04, FR-MQTT-03,
      FR-MED-06) y la parte de red de JRN-02 (siguen haciendo falta las pre-releases
      ota-test-*). La salida es solo hacia direcciones públicas: la LAN de la casa queda
      cerrada. Si el banco vuelve al original (sudo harness-volver-original), la capacidad
      vuelve a no
  bench-sntp-block:
    what: bloquear y desbloquear UDP/123 hacia fuera desde la red del banco
    available: yes
    reported_by: >
      GET /api/info → capabilities incluye bench-sntp-block (build 8966260);
      GET /api/wifi/internet → sntp_blocked, rules. POST /api/wifi/sntp_block {"blocked"}
      (fork villa-1, H-73)
    observed: >
      2026-11-08, FORK-01 y FORK-02 (test-results/20261108T141629Z-660f6f5/): la regla DROP
      de UDP/123 va antes de cualquier ACCEPT; con SNTP bloqueado y el DUT reiniciado, 0
      sincronizaciones en 75 s, 2 «sntp: fallo» y hora_valida = false; al desbloquear,
      sincroniza a 5,0 s. ap_stop y el arranque del portal lo desbloquean
  bench-dns-override:
    what: resolver un host permitido hacia un servidor HTTPS con certificado autofirmado (FR-OTA-03, T20 tls)
    available: no
    reason: el banco no reporta esta capacidad — petición CR-TB-05 (testing/testbench-change-requests.md)
  bench-traffic-capture:
    what: capturar el tráfico UDP que sale del DUT (FR-LOG-01, FR-LOG-02 fila de captura)
    available: no
    reason: >
      el banco solo reporta el receptor del puerto 5555, no una captura del
      tráfico — petición CR-TB-04 (testing/testbench-change-requests.md)
  bench-serial-write:
    what: escribir en la consola del DUT por el slot (comandos de la imagen de banco, FSD §18 E13)
    available: no
    reason: >
      el banco no la reporta por GET (GET /api/serial/write → 404), y lo que el
      banco no reporta queda en no (nota de testbench). Evidencia de que
      existe: POST /api/serial/write SLOT1 con una línea vacía el 2026-11-01 →
      ok, written 2, sin reset del DUT (por el proxy del slot, con DTR/RTS en
      bajo). Ningún test la necesita todavía; si uno la necesita, se pide al
      banco que la reporte (petición al testbench)
  bench-power-cycle:
    what: cortar y devolver la alimentación del DUT por instrumento
    available: no
    reason: >
      el banco reporta EN/BOOT por GPIO (has_gpio, gpio_wired sin determinar; el
      2026-11-06 un pulso en la GPIO EN no reinició el DUT: hoy no llega a su EN),
      no corte de alimentación; el corte lo hace el operador desenchufando el
      USB-C (bench-operator-prompt), pero tras el corte la captura serie vuelve
      ~2 s después del arranque y pierde boot:/cfg:/con: — petición CR-TB-10
  bench-portal-dns:
    what: >
      que el relé HTTP del banco, unido al AP de un DUT, resuelva los nombres con
      el DNS que le da el DHCP de esa red (o un endpoint que haga una consulta DNS
      contra una IP dada), y que pueda no seguir redirecciones
    available: no
    reason: >
      observado el 2026-11-04: con el banco unido al AP del DUT, GET
      http://example.com/ por /api/wifi/http se resuelve con el DNS del Pi, sale
      por eth0 y devuelve la página real (200, 577 bytes); y urllib sigue los
      302. Pedido como CR-TB-09
  bench-driver:
    what: TestbenchDriver instalado en el devcontainer (nivel bench)
    available: yes
    pinned: db6a0933075bb9ff5a99bb8e307a54b6a01af57d   # testbench, PR #42 (2026-10-09)
    sha256: 8ed154118de9d0130d7ac3a25a1c32d550bd832e3b09c5961fca2a85414691bb
    installed_by:
      source: .devcontainer/Dockerfile (ARG TESTBENCH_COMMIT / TESTBENCH_DRIVER_SHA256), en el site-packages de /opt/bench-venv
      check: .github/workflows/devcontainer.yml#image/Toolchain and bench tier present — importa TestbenchDriver («TestbenchDriver OK») y lee /opt/bench-venv/TESTBENCH_COMMIT
      run: 41552251499   # devcontainer image builds, success, commit fdf4cf2; el log contiene «TestbenchDriver OK» y db6a0933…
    observed: >
      2026-11-02, desde la imagen nodo-clima-piloto-dev reconstruida:
      TestbenchDriver(TESTBENCH_URL).info() → hostname testbench-b99c;
      get_devices() → SLOT1 idle, SLOT2/3/4 absent; ap_status() → active false.
      Ojo: serial_reset/serial_output/serial_monitor tienen SLOT2 por defecto;
      los tests pasan siempre slot=dut.slot (SLOT1)

  # --- infraestructura propia ---
  hosted-ci:
    what: runner alojado de GitHub (host, build, escaneo de secretos)
    available: yes
  release-verification:
    what: journey lanzado por tag contra el artefacto publicado (runner self-hosted en el devcontainer)
    available: no
    reason: runner instalado pero sin registrar — el registro es una autorización del propietario (scripts/runner/register.sh)

  # --- equipo y pares del proyecto (unproven hasta verlos funcionar aquí) ---
  dut-board:
    what: la Waveshare ESP32-S3-DEV-KIT-N8R8 del SLOT1, identificada como la unidad del FSD (chip, flash 8 MB, PSRAM)
    available: yes
    observed: >
      2026-11-01, commit 05735b7 — identidad en dut.identity (C-HW-01/02);
      camino de ida en commissioning.forward_path; agenda fila 1 cerrada
  sht41-wiring:
    what: SHT41 en GPIO8/9, 100 kHz, dirección 0x44, con pull-ups (C-HW-04/05)
    available: yes
    observed: >
      2026-11-01, commit fd2dbf7, tests/target/i2c_probe en SLOT1, tras montar el propietario
      el SHT41 (3V3, GND, SDA=GPIO8, SCL=GPIO9; continuidad comprobada). El
      escaneo que cuenta, solo con pull-ups externos, da
      «i2c: scan sda=8 scl=9 hz=100000 ack=0x44», con SDA y SCL cruzados
      ack=ninguno. Las lecturas tienen CRC válido, T ≈ 30,4 °C (en [0, 50]) y
      HR ≈ 63–64 %: 9 seguidas en un monitor de 13 s y 3 de 3 en cada uno de
      3 arranques. Antes de montarlo, el bus vacío daba ack=ninguno (sonda
      validada como instrumento)
    consequence: >
      la primera lectura tras el arranque salía «med: invalida (nack)» en 3 de
      3 arranques. Causa en la sonda: a 100 Hz, vTaskDelay(pdMS_TO_TICKS(10))
      es un tick y puede durar casi 0 ms, así que el SHT41 aún estaba
      convirtiendo. Con «+ 1» tick, 3 de 3 arranques salen válidos desde la
      primera lectura. El driver real (§8, L1) tiene que esperar ≥ 10 ms
      reales: si no, FR-SEN-01 (target) falla con «med: invalida» en el primer
      ciclo
  sda-disconnect:
    what: interrumpir SDA del SHT41 bajo demanda — el operador desconecta el Dupont de SDA en la protoboard (no hay conmutador)
    available: yes
    observed: >
      2026-11-01, commit 1587098, tests/target/i2c_probe en SLOT1. Aviso bloqueante del banco
      «desconecta SDA», confirmado por el operador en 27 s: las 3 lecturas
      siguientes salen «med: invalida (nack)», «(nack)» y «(crc)». Aviso
      «reconecta SDA», confirmado: la primera lectura sale válida
      (T=30.69 HR=63.13) y las siguientes también. El contador de tiempo sube
      sin saltos y no hay ninguna línea rst:, así que no hubo reinicio ni
      bloqueo del bus. Lo observa el log del DUT, no el operador
    consequence: >
      con SDA suelto, la línea flota y puede devolver tramas con CRC
      incorrecto en lugar de NACK; el driver real tiene que tratar las dos
      como inválidas (FR-SEN-02, ya en su contrato host). Un primer aviso con
      180 s de plazo caducó sin confirmación; para esta acción se usan 300 s
  home-assistant-test:
    what: instancia de Home Assistant con integración MQTT apuntando al broker de prueba
    available: yes
    reported_by: scripts/ha/ha_prueba.py up (instancia nueva; .ha-prueba.env, no versionado)
    exercised: >
      2026-11-07, JRN-01.5 sobre 7096cb7: homeassistant/home-assistant:2026.10.4 en el
      Docker de WSL de la laptop, integración MQTT contra el broker del banco por la LAN
    decision: >
      H-52 (propietario, 2026-11-07): corre en la laptop, en el Docker de WSL,
      conectada al broker del banco por la LAN; nada se instala en el Pi del banco
  github-test-releases:
    what: pre-releases ota-test-* del repo con las imágenes de prueba OTA (FSD §22.0)
    available: unproven
  reference-instrument:
    what: termohigrómetro de referencia para NFR-SEN-01, contrastado con sobres de calibración de HR del 33 % y del 75 %
    available: unproven
    observed: >
      H-77 (propietario, 2026-11-09): la referencia es el sensor interior WH32B de la
      WS-2000, leído en su consola (resolución 0,1 °C y 1 % HR). Contrastado ese día con la
      prueba de la sal: 75 % HR a 29,7 °C, corrección 0. Los sobres del 33 % y 75 % no
      llegaron y el punto del 33 % no se hará; la temperatura no está contrastada. Con un
      solo punto, el FSD (NFR-SEN-01, «No debe ocurrir») no admite el resultado
  field-site:
    what: el nodo instalado en la vivienda con su router, broker y HA (nivel field)
    available: unproven
    agenda: no — no la necesita ningún test de banco; se prueba al instalar el nodo (Ready for shipment)

# ---------------------------------------------------------------------------
# Tests. JRN = workflow (el recorrido estándar, en orden). TC = atómico.
# Ola 1 escribe solo standard; deviation y negative quedan bloqueados por ola.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Commissioning (Fase 2). Registros observados, no tests: interrogan el montaje.
# ---------------------------------------------------------------------------
commissioning:
  forward_path:
    status: successful
    date: 2026-11-01
    commit: 05735b7
    ci_run: 41307192774   # build.yml, workflow_dispatch variant=bench version=0.0.0, ref main
    artifact: firmware-v0.0.0-bench
    flash_offsets_from: coldflash/flash_args del artefacto
    flash_offsets: {bootloader.bin: "0x0", partition-table.bin: "0x8000", ota_data_initial.bin: "0xf000", nodo_clima.bin: "0x20000"}
    flash: POST /api/flash SLOT1 esp32s3 460800 — returncode 0, hash verificado en las cuatro imágenes
    observed: >
      POST /api/serial/reset SLOT1 (P-BOOT-CAPTURE): «App version: 0.0.0-bench»,
      «nodo: NODO-BENCH-IMAGE» y «nodo: Init complete» en la consola del slot;
      el bootloader carga la app de 0x20000 con la tabla de partitions.csv
    note: la NVS no se borró — el esqueleto no la usa; JRN-01.0 la borra como parte de su expect

tests:
  # JRN-01 — el recorrido ordinario de principio a fin (pregunta 2 del harness,
  # respondida por el propietario el 2026-10-31). Los pasos se ejecutan en orden
  # y cada uno parte del estado que deja el anterior; es la puerta que pasa cada
  # sesión con hardware y los primeros tests de la ola 1. impl lo escribe /build.
  - id: JRN-01.0
    shape: workflow
    kind: standard
    wave: 1
    phase: 1
    tier: bench
    verifies: [C-HW-02]
    needs: [bench-driver, hosted-ci, bench-flash, bench-serial-monitor, dut-board]
    procedure: gh workflow run build.yml -f variant=bench -f version=0.0.0 --ref main; artefacto firmware-v0.0.0-bench de ese run
    expect: >
      se graba en SLOT1 la imagen construida por la CI sobre el commit que se
      prueba (en una sesión de /build, la de banco: un push solo construye
      producción y la de banco se lanza con workflow_dispatch de build.yml; en
      el job verify, la de producción del tag, --firmware-dir), con los offsets
      de su flash_args y la NVS borrada; tras el último rst: de un reset
      (P-BOOT-CAPTURE) aparecen la versión de la imagen e «Init complete», y
      NODO-BENCH-IMAGE si la imagen es de banco o ninguna línea con
      NODO-BENCH-IMAGE si es de producción (C-LOG-01)
    impl: tests/bench/test_jrn01.py::test_jrn_01_0_flash_ci_image
    status: successful
    commit: 7096cb7
    date: 2026-11-07
    ci_run: 42380835421   # build.yml, workflow_dispatch variant=bench version=0.0.0-7096cb7
    evidence: test-results/20261107T141937Z-7096cb7/
    runs:
      - {variant: bench, ci_run: 42331782616, evidence: test-results/20261107T030123Z-c5369e0/, commit: c5369e0}
